[project]
name = "relay-studio-backend"
version = "0.1.0"
description = "Relay Studio Python 3.12 FastAPI and LangGraph backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "openai>=1.50.0",
    "pydantic>=2.0.0",
    "vercel-sandbox>=0.11.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
